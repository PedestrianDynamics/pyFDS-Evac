[project]
name = "pyfds-evac"
version = "0.1.0"
description = "Fire Dynamics Simulator (FDS) evacuation modeling with visibility analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Mohcine Chraibi", email = "m.chraibi@fz-juelich.de" },
    { name = "Gregory Shouldice", email = "gregoryshouldice@gmail.com" },
    { name = "Kristian Börger", email = "boerger@uni-wuppertal.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jupedsim>=1.4.2",
    "pedpy",
    "fdsreader",
    "plotly",
    "nbformat>=4.2.0",
    "matplotlib",
    "shapely",
    # Exact pin: visibility.py patches the private _get_visibility_array to
    # cap each sign at its own reading distance.
    "fdsvismap==0.3.1",
    "numpy>=2.1",
]

[project.optional-dependencies]
gui = [
    "python-fasthtml",
    "monsterui",
    # Starlette needs this to parse multipart forms (the scenario upload).
    "python-multipart",
]

[project.urls]
Homepage = "https://github.com/PedestrianDynamics/pyFDS-Evac"
Repository = "https://github.com/PedestrianDynamics/pyFDS-Evac"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyfds_evac"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external_data: needs FDS output from the external data store (sciebo); skips when absent, CI deselects it",
]

[tool.coverage.run]
# run.py is the CLI at the repository root; tests import it directly.
source_pkgs = ["pyfds_evac", "run"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting. The codebase already
# follows the stdlib / third-party / local grouping everywhere; nothing enforced
# it, so a misplaced import passed `ruff check` while being wrong -- which is
# exactly what happened in #74 and was caught by a reviewer rather than by CI.
extend-select = ["I"]
