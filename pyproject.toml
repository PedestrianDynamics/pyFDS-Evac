[project]
name = "pyfds-evac"
version = "0.2.0"
description = "Fire Dynamics Simulator (FDS) evacuation modeling with visibility analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Mohcine Chraibi", email = "m.chraibi@fz-juelich.de" },
    { name = "Gregory Shouldice", email = "gregoryshouldice@gmail.com" },
    { name = "Kristian Börger", email = "boerger@uni-wuppertal.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jupedsim>=1.4.2",
    "pedpy",
    "fdsreader",
    "plotly",
    "nbformat>=4.2.0",
    "matplotlib",
    "shapely",
    # Exact pin: visibility.py patches the private _get_visibility_array to
    # cap each sign at its own reading distance.
    "fdsvismap==0.3.1",
    "numpy>=2.1",
]

[project.optional-dependencies]
gui = [
    "python-fasthtml",
    "monsterui",
    # Starlette needs this to parse multipart forms (the scenario upload).
    "python-multipart",
]

[project.scripts]
pyfds-evac = "pyfds_evac.cli:main"

[project.urls]
Homepage = "https://github.com/PedestrianDynamics/pyFDS-Evac"
Repository = "https://github.com/PedestrianDynamics/pyFDS-Evac"
Documentation = "https://pedestriandynamics.org/pyFDS-Evac/"
Issues = "https://github.com/PedestrianDynamics/pyFDS-Evac/issues"
Changelog = "https://github.com/PedestrianDynamics/pyFDS-Evac/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyfds_evac"]

[tool.hatch.build.targets.sdist]
# The sdist carries the package, the CLI, tests and the scenarios they
# use; the website, planning notes and literature summaries stay in git.
exclude = [
    "/.github",
    "/.opencode",
    "/.specify",
    "/artifacts",
    "/materials",
    "/site",
    "/specs",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "seaborn>=0.13.2",
]

[tool.uv]
# fdsvismap 0.3.1 requires scikit-image ~= 0.23.2, which
# has no cp313/cp314 wheels and fails to build from source on 3.13 and 3.14.
# fdsvismap uses only skimage.draw.line and line_aa, whose output is the same
# in 0.26; tests/test_skimage_line_contract.py checks it on every version.
# Upstream issue: none yet. Remove once an fdsvismap release allows 0.26.
# The override applies to uv only; pip still sees fdsvismap's pin.
override-dependencies = [
    "scikit-image~=0.23.2; python_version < '3.13'",
    "scikit-image~=0.26.0; python_version >= '3.13'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "external_data: needs FDS output from the external data store (sciebo); skips when absent, CI deselects it",
]

[tool.coverage.run]
# The CLI is pyfds_evac.cli; run.py at the repository root only runs it.
source_pkgs = ["pyfds_evac"]
branch = true
relative_files = true

[tool.coverage.report]
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting. The codebase already
# follows the stdlib / third-party / local grouping everywhere; nothing enforced
# it, so a misplaced import passed `ruff check` while being wrong -- which is
# exactly what happened in #74 and was caught by a reviewer rather than by CI.
extend-select = ["I"]
