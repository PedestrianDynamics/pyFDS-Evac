[project]
name = "pyfds-evac"
version = "0.1.0"
description = "Fire Dynamics Simulator (FDS) evacuation modeling with visibility analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Mohcine Chraibi", email = "m.chraibi@fz-juelich.de" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "jupedsim>=1.4.2",
    "pedpy",
    "fdsreader",
    "plotly",
    "nbformat>=4.2.0",
    "matplotlib",
    "shapely",
    "fdsvismap>=0.1.3",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
gui = [
    "python-fasthtml",
    "monsterui",
]

[project.urls]
Homepage = "https://github.com/PedestrianDynamics/pyFDS-Evac"
Repository = "https://github.com/PedestrianDynamics/pyFDS-Evac"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyfds_evac"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus import sorting. The codebase already
# follows the stdlib / third-party / local grouping everywhere; nothing enforced
# it, so a misplaced import passed `ruff check` while being wrong -- which is
# exactly what happened in #74 and was caught by a reviewer rather than by CI.
extend-select = ["I"]
