name: code quality

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  fds-evac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv
        run: pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --locked --python 3.14 --all-groups
      - name: Lint with Ruff
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      
