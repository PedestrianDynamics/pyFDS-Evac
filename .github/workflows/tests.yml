name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --all-groups --extra gui
      # The whole suite (testpaths in pyproject.toml). Tests that need FDS
      # output from the external data store carry the external_data marker
      # and are deselected here; locally they skip when the data is absent.
      - name: Run the test suite
        run: uv run pytest -q -m "not external_data"
