name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  # OIDC upload to Codecov; no repository secret needed.
  id-token: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      # Coverage runs on 3.14 only: with branch coverage, coverage.py uses
      # the fast sys.monitoring core from Python 3.14 on and the much
      # slower trace function before.
      COVERAGE_LEG: ${{ matrix.python-version == '3.14' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --all-groups --extra gui --extra tui
      # The whole suite (testpaths in pyproject.toml). Tests that need FDS
      # output from the external data store carry the external_data marker
      # and are deselected here; locally they skip when the data is absent.
      - name: Run the test suite
        if: env.COVERAGE_LEG != 'true'
        run: uv run pytest -q -m "not external_data"
      - name: Run the test suite with coverage
        if: env.COVERAGE_LEG == 'true'
        run: uv run pytest -q -m "not external_data" --cov --cov-report=xml --cov-report=term
      # Pull requests from forks get no OIDC token; they upload tokenless,
      # which Codecov accepts for public repositories. An upload failure
      # never fails the job.
      - name: Upload coverage to Codecov
        if: env.COVERAGE_LEG == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          disable_search: true
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
          fail_ci_if_error: false

  # The release gate's install check on one Python version: build the
  # wheel, pip install it with [gui] into a fresh venv, time the first
  # pyfds-evac --help and pyfds-evac-gui --help, and run a small scenario
  # outside the checkout (scripts/release_check.py install, #478). The
  # limit is 3 s here, not the release gate's 1 s: shared runners vary in
  # speed, and 3 s still catches the 15-28 s first --help of 0.2.1/0.2.2.
  wheel-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Build the wheel
        run: uv build --wheel --out-dir dist
      - name: Install the wheel in a fresh venv and time the first --help
        run: >
          python scripts/release_check.py install --wheel dist/*.whl
          --python 3.12 --limit 3.0
          --work "$RUNNER_TEMP/install" --logs "$RUNNER_TEMP/install-logs"
          --results "$RUNNER_TEMP/install.tsv"
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-install-logs
          path: ${{ runner.temp }}/install-logs
