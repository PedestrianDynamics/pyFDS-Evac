# Codecov settings. Both statuses are informational: they report coverage
# on commits and pull requests but never fail a check.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: true
  hide_project_coverage: false
