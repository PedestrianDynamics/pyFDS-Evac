[study-schroeder2020]
title = "ASET-RSET maps after Schröder et al. (2020)"
zip = "pyfds-evac-study-schroeder2020.zip"
page = "docs/studies/study-schroeder2020/"
source = "docs/study-schroeder2020.md"
summary = """\
100 people leave a 30 x 10 x 3 m room with one door (or two) while a \
60 kW fire fills it with smoke. You run the FDS decks yourself, then the \
script that runs 160 evacuations and builds the ASET, RSET and DIFF maps. \
Room, door, fire and crowd follow the authors' release, \
doi:10.5281/zenodo.3875550. No file of that release is in this zip; the \
optional comparison with it (step 6) needs you to download it from \
Zenodo."""
contents = """\
The FDS decks and scenarios of both families (release conditions and the \
room rebuilt from the paper), their generators, run.py, the map, \
animation and grid scripts, pinned package versions and a README.txt \
with every command, the runtimes and the expected result. No file of the \
authors' release is included."""
files = [
  ["assets/schroeder2020_room/README.md", "what the inputs are and where they come from"],
  ["assets/schroeder2020_room/make_decks_rel.py", "writes the FDS decks of the rel_* family (release conditions)"],
  ["assets/schroeder2020_room/make_configs_rel.py", "writes the scenarios and geometry of the rel_* family"],
  ["assets/schroeder2020_room/make_decks.py", "writes the FDS decks of the hrr060_* family (paper alone)"],
  ["assets/schroeder2020_room/make_configs.py", "writes the scenarios and geometry of the hrr060_* family"],
  ["assets/schroeder2020_room/rel_1door/", "one door, 0.2 m grid: FDS deck, scenarios for the pre-movement sweep, geometry"],
  ["assets/schroeder2020_room/rel_1door_dx010/", "one door, 0.1 m grid: FDS deck, scenarios, geometry"],
  ["assets/schroeder2020_room/rel_2door/", "two doors, 0.2 m grid: FDS deck and one scenario per seed and version in seeds/"],
  ["assets/schroeder2020_room/hrr060_1door/", "sensitivity, one door, 0.2 m grid"],
  ["assets/schroeder2020_room/hrr060_1door_dx010/", "sensitivity, one door, 0.1 m grid"],
  ["assets/schroeder2020_room/hrr060_1door_pert/", "sensitivity, one door, HRRPUA +0.1 % (FDS deck only)"],
  ["assets/schroeder2020_room/hrr060_2door/", "sensitivity, two doors, 0.2 m grid"],
  ["run.py", "the pyFDS-Evac command line, which the map script calls for each run"],
  ["scripts/docs/schroeder_room_maps.py", "runs the evacuations, prints every number of the page, draws the maps"],
  ["scripts/docs/study_animations.py", "the two animations"],
  ["scripts/docs/schroeder_grid_figures.py", "the grid figures"],
  ["scripts/docs/first_fds_case_figures.py", "helpers used by the animation script"],
  ["scripts/animate_agents_smoke.py", "helpers used by the animation script"],
]
extra_packages = ["seaborn"]
steps = [
  ["Copy the three rel_* folders to DATA, a folder outside this one, and run FDS in each with 6 MPI processes (22 min, 28 min, and 4 h 14 min for the 0.1 m grid)", [
    "DATA=$HOME/schroeder2020-room",
    "for V in rel_1door rel_2door rel_1door_dx010; do",
    "  mkdir -p \"$DATA\" && cp -R assets/schroeder2020_room/$V \"$DATA/\"",
    "  (cd \"$DATA/$V\" && mpiexec -n 6 fds $V.fds)",
    "done",
  ]],
  ["Install PedPy 1.5.1 for compute_rset_map; it replaces the pinned 1.4.0", [
    "pip install \"pedpy==1.5.1\"",
  ]],
  ["Run the 160 evacuations, print the page's numbers and draw the maps (about 5 min with 6 workers). RUNS is an empty folder outside this one", [
    "RUNS=$HOME/schroeder2020-runs",
    "python scripts/docs/schroeder_room_maps.py --data \"$DATA\" --runs \"$RUNS\" --family rel",
  ]],
  ["Draw the animations (needs ffmpeg) and the grid figures", [
    "python scripts/docs/study_animations.py schroeder --data \"$DATA\" --runs \"$RUNS\" --family rel",
    "python scripts/docs/schroeder_grid_figures.py --data \"$DATA\" --cache \"$RUNS/cache\" --family rel",
  ]],
  ["Optional, the comparison with the authors' release: download it from https://doi.org/10.5281/zenodo.3875550, unpack it to RELEASE, and run step 4 again with --release (the runs are reused)", [
    "python scripts/docs/schroeder_room_maps.py --data \"$DATA\" --runs \"$RUNS\" --family rel --release RELEASE",
  ]],
  ["Optional, the sensitivity (room rebuilt from the paper alone): FDS on the four hrr060_* folders (20 min, 18 min, 4 h 8 min and 15 min), then the maps and the grid figures with their own runs folder", [
    "for V in hrr060_1door hrr060_2door hrr060_1door_dx010 hrr060_1door_pert; do",
    "  cp -R assets/schroeder2020_room/$V \"$DATA/\"",
    "  (cd \"$DATA/$V\" && mpiexec -n 6 fds $V.fds)",
    "done",
    "python scripts/docs/schroeder_room_maps.py --data \"$DATA\" --runs \"$HOME/schroeder2020-runs-hrr060\" --family hrr060",
    "python scripts/docs/schroeder_grid_figures.py --data \"$DATA\" --cache \"$HOME/schroeder2020-runs-hrr060/cache\" --family hrr060",
  ]],
]
fds = "FDS-6.10.1-0-g12efa16-release"
fds_runtime = "1308 s (rel_1door), 1708 s (rel_2door) and 15260 s (rel_1door_dx010) wall clock with 6 MPI processes on an Apple M3 Pro, macOS"
