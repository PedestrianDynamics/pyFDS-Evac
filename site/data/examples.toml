# Downloadable inputs of the example pages.
#
# scripts/docs/bundle_examples.py reads this file and writes one zip per
# entry to site/static/downloads/, plus the generated facts (size, sha256,
# commit, package versions) to site/data/example_bundles.json. The
# example-files shortcode renders both. Every path in `files` is a file in
# the repository, or a folder ending in `/` whose files all go in; the zip
# keeps the repository layout, so the commands run from the unpacked folder
# exactly as on the page. FDS output never goes in: users run FDS. A page
# may name an FDS output folder of the repository; list it in
# `not_in_zip`, with the step that writes it.
#
# Values that do not come from the repository or uv.lock are stated here
# once: the FDS version and runtime, and the results the page shows with the
# commit that produced them. The optional `results_note` is shown on the
# page right under that commit, for a caveat on the results, such as a
# release they were not re-checked for.

