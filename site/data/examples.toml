# Downloadable inputs of the example pages.
#
# scripts/docs/bundle_examples.py reads this file and writes one zip per
# entry to site/static/downloads/, plus the generated facts (size, sha256,
# commit, package versions) to site/data/example_bundles.json. The
# example-files shortcode renders both. Every path in `files` is a file in
# the repository; the zip keeps the repository layout, so the commands run
# from the unpacked folder exactly as on the page.
#
# Values that do not come from the repository or uv.lock are stated here
# once: the FDS version and runtime, and the results the page shows with the
# commit that produced them.

[quickstart]
title = "Quickstart"
zip = "pyfds-evac-quickstart.zip"
page = "docs/getting-started/quickstart/"
source = "docs/quickstart.md"
summary = """\
One agent walks a corridor 2 m wide and 100 m long (assets/ISO-table21), \
once in clear air and once in uniform smoke with K = 3 1/m. No FDS run is \
needed."""
contents = """\
The example script, run.py, the scenario folder assets/ISO-table21, pinned \
package versions and a README.txt with the commands and the expected \
result."""
files = [
  ["examples/quickstart.py", "the example script"],
  ["assets/ISO-table21/config.json", "JuPedSim scenario"],
  ["assets/ISO-table21/geometry.wkt", "walkable area"],
  ["assets/ISO-table21/ISO-table21.fds", "FDS deck of the same corridor (ISO 20414 Test 18); the quickstart does not run it"],
  ["assets/ISO-table21/README.md", "what the scenario is and where it comes from"],
  ["run.py", "the pyFDS-Evac command line, which the page compares with run_scenario"],
]
extra_packages = []
steps = [
  ["Run the example (about 3 s)", ["python examples/quickstart.py"]],
]
fds = ""
fds_runtime = ""
evac_runtime = "about 3 s"
expected = [
  "clear air:   79.24 s",
  "K = 3.0 1/m: 104.39 s",
  "speed factor in smoke: 0.7578",
  "time ratio smoke/clear: 1.3174",
]
expected_note = "The last line, manifest: <path>, names a new temporary file on every run."
results_commit = "6f335a37"
results_python = "3.12.13"
results_machine = "Apple M3 Pro, macOS"

[first-fds-case]
title = "A crowd in a real fire"
zip = "pyfds-evac-first-fds-case.zip"
page = "docs/getting-started/first-fds-case/"
source = "docs/first-fds-case.md"
summary = """\
150 agents leave a T-shaped corridor while a 2 MW PVC fire fills it with \
smoke. You run the FDS deck yourself, then pyFDS-Evac on its output."""
contents = """\
The FDS deck, the scenario, run.py, the example and figure scripts, \
pinned package versions and a README.txt with every command, the \
runtimes and the expected result."""
files = [
  ["assets/t_junction/t_junction.fds", "FDS deck of the fire"],
  ["assets/t_junction/config.json", "JuPedSim scenario"],
  ["assets/t_junction/geometry.wkt", "walkable area"],
  ["run.py", "the pyFDS-Evac command line"],
  ["examples/first_fds_case.py", "the same run from Python"],
  ["scripts/docs/first_fds_case_figures.py", "the figures of section 5"],
  ["scripts/animate_agents_smoke.py", "animation helpers used by the figure script"],
  ["scripts/docs/first_fds_case_aset.py", "the numbers and figures of section 6 (ASET and RSET)"],
]
extra_packages = ["seaborn"]
steps = [
  ["Check the scenario runs in clear air (about 5 s)", [
    "python examples/first_fds_case.py",
  ]],
  ["Run FDS (about 20 min with 4 MPI processes)", [
    "mkdir -p fire && cp assets/t_junction/t_junction.fds fire/",
    "cd fire && mpiexec -n 4 fds t_junction.fds && cd ..",
  ]],
  ["Run pyFDS-Evac in the fire (about 25 s) and in clear air", [
    "FDS=fire",
    "mkdir -p tj",
    "python run.py --scenario assets/t_junction --fds-dir \"$FDS\" \\",
    "    --output-sqlite tj/tj_fire.sqlite \\",
    "    --output-smoke-history tj/tj_fire_smoke.csv \\",
    "    --output-fed-history tj/tj_fire_fed.csv \\",
    "    --output-route-history tj/tj_fire_routes.csv",
    "python run.py --scenario assets/t_junction \\",
    "    --output-sqlite tj/tj_clear.sqlite",
    "python examples/first_fds_case.py \"$FDS\"",
  ]],
  ["Draw the figures of section 5", [
    "python scripts/docs/first_fds_case_figures.py --data \"$FDS\" --runs tj",
  ]],
  ["Section 6 (ASET and RSET) needs a newer fdsvismap; install it last, it replaces the pinned one", [
    "pip install --no-deps \"fdsvismap @ git+https://github.com/FireDynamics/fdsvismap@31dc0b6\"",
    "python scripts/docs/first_fds_case_aset.py --data \"$FDS\" --runs tj",
    "pip install -r requirements.txt   # back to the pinned fdsvismap",
  ]],
]
fds = "FDS-6.10.1-0-g12efa16-release"
fds_runtime = "1169 s wall clock (about 20 min) with 4 MPI processes on an Apple M3 Pro, macOS"
evac_runtime = "about 25 s for the fire run"
expected = [
  "evacuated: 72/150 in 300 s",
  "FED max:   0.38",
  "route changes: {'smoke_reroute': 9, 'wander': 164}",
]
expected_note = """\
These are the last lines of python examples/first_fds_case.py "$FDS". \
Without FDS output it prints evacuated: 144/150 in 300 s. run.py ends \
with: Simulation stopped after 300.00 s (72/150 evacuated, 78 remaining)."""
results_commit = "6f335a37"
results_python = "3.12.13"
results_machine = "Apple M3 Pro, macOS"

[study-schroeder2015]
title = "Route choice in smoke after Schröder et al. (2015)"
zip = "pyfds-evac-study-schroeder2015.zip"
page = "docs/studies/study-schroeder2015/"
source = "docs/study-schroeder2015.md"
summary = """\
200 agents leave an assembly hall through door A or B and a corridor with \
exits E and F while a fire grows in the room next to the hall. You run the \
three FDS decks yourself, then pyFDS-Evac with and without smoke-aware \
routing, then the scripts that print the page's numbers and draw its \
figures."""
contents = """\
The three FDS decks, the geometry and deck generators, the two scenarios, \
the run script, run.py, the two figure scripts, pinned package versions \
and a README.txt with every command, the runtimes and the expected \
result."""
files = [
  ["assets/schroeder2015_route/README.md", "what the inputs are and where they come from"],
  ["assets/schroeder2015_route/geometry.py", "every coordinate: walkable area, stages, FDS walls and doors"],
  ["assets/schroeder2015_route/make_configs.py", "writes the two scenarios and geometry.wkt"],
  ["assets/schroeder2015_route/make_decks.py", "writes the FDS decks of all nine fire variants"],
  ["assets/schroeder2015_route/run_p1.sh", "runs the evacuation arms, seeds 1-10, on one FDS output"],
  ["assets/schroeder2015_route/evac/config_gate.json", "scenario, cost model gate (also no fire and smoke-blind)"],
  ["assets/schroeder2015_route/evac/config_additive.json", "scenario, cost model additive"],
  ["assets/schroeder2015_route/evac/geometry.wkt", "walkable area"],
  ["assets/schroeder2015_route/a047_pvc_h40/a047_pvc_h40.fds", "FDS deck of the main fire"],
  ["assets/schroeder2015_route/a047_pvc_h35/a047_pvc_h35.fds", "FDS deck of a comparison fire (ceiling 3.5 m)"],
  ["assets/schroeder2015_route/a012_pvc_h30/a012_pvc_h30.fds", "FDS deck of a comparison fire (medium growth, ceiling 3.0 m)"],
  ["run.py", "the pyFDS-Evac command line"],
  ["scripts/docs/schroeder2015_route.py", "the evacuation numbers and figures of the page"],
  ["scripts/docs/schroeder2015_fire_figures.py", "the geometry and fire numbers and figures (needs all nine fires)"],
]
extra_packages = ["seaborn", "scipy"]
steps = [
  ["Run FDS on the three decks, 6 MPI processes each (about 60-100 min per deck). DATA is a folder outside this one", [
    "DATA=$HOME/schroeder2015-route",
    "for F in a047_pvc_h40 a047_pvc_h35 a012_pvc_h30; do",
    "  mkdir -p \"$DATA/$F\" && cp assets/schroeder2015_route/$F/$F.fds \"$DATA/$F/\"",
    "  (cd \"$DATA/$F\" && mpiexec -n 6 fds $F.fds)",
    "done",
  ]],
  ["Run the evacuation arms, 10 seeds each (about 25-40 s per run; 6 in parallel)", [
    "bash assets/schroeder2015_route/run_p1.sh \"$DATA/a047_pvc_h40\" \"$DATA/p1_a047_pvc_h40\" 6 --with-nofire",
    "bash assets/schroeder2015_route/run_p1.sh \"$DATA/a047_pvc_h35\" \"$DATA/p1_a047_pvc_h35\" 6",
    "bash assets/schroeder2015_route/run_p1.sh \"$DATA/a012_pvc_h30\" \"$DATA/p1_a012_pvc_h30\" 6",
  ]],
  ["Print the page's numbers and draw its evacuation figures (about 3 min)", [
    "python scripts/docs/schroeder2015_route.py --data \"$DATA\"",
  ]],
  ["Optional, for the fire-choice figures: write and run the other six fire decks (about 6 h in all)", [
    "python assets/schroeder2015_route/make_decks.py \"$DATA\"",
    "for F in a047_pvc_h30 a047_pur_h30 a047_pur_h40 a012_pvc_h40 a012_pur_h30 a012_pur_h40; do",
    "  (cd \"$DATA/$F\" && mpiexec -n 6 fds $F.fds)",
    "done",
    "python scripts/docs/schroeder2015_fire_figures.py --data \"$DATA\"",
  ]],
]
fds = "FDS-6.10.1-0-g12efa16-release"
fds_runtime = "5423 s (a047_pvc_h40), 5929 s (a047_pvc_h35) and 3662 s (a012_pvc_h30) wall clock with 6 MPI processes on an Apple M3 Pro, macOS"
evac_runtime = "about 25-40 s per run, 100 runs"
expected = [
  "main fire, exit-E share: no fire 0.520, gate 0.678, additive 0.445",
  "main fire, additive dy: -1.77 m (-2.20, -1.35)",
  "main fire, gate door-B share: 0.05 for starts 30-120 s, 0.94 after 150 s",
]
expected_note = """\
scripts/docs/schroeder2015_route.py prints these lines after its tables \
and before it writes the figures. The \
evacuation runs are reproducible for a given seed; FDS output from \
another FDS build or machine can move them slightly."""
results_commit = "7e9c4c30"
results_python = "3.12.13"
results_machine = "Apple M3 Pro, macOS"
