baseURL: https://pedestriandynamics.org/pyFDS-Evac/
languageCode: en-us
title: pyFDS-Evac

markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      image:
        enableDefault: true
      link:
        enableDefault: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]

# last-updated dates from the last commit touching each page
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    # The reference documentation lives in the repository's docs/ directory
    # and is served from there unchanged; working notes stay out of the site.
    # docs/ stays flat for GitHub readers; the mounts below place each page
    # into its sidebar group. A page listed in a group mount must also be
    # listed in excludeFiles here, or it is served twice.
    - source: ../docs
      target: content/docs
      excludeFiles:
        - "*-notes.md"
        - "archive/**"
        - "superpowers/**"
        - "quickstart.md"
        - "walkthrough.md"
        - "coming-from-fds-evac.md"
        - "concepts.md"
        - "limitations.md"
        - "model-comparison.md"
        - "fds-case-requirements.md"
        - "usage.md"
        - "howto-rset-ensemble.md"
        - "assets.md"
        - "fds-sampling.md"
        - "smoke-speed-model.md"
        - "routing.md"
        - "route-cost-gate.md"
        - "wayfinding.md"
        - "testing-*.md"
    - source: ../docs
      target: content/docs/getting-started
      includeFiles:
        - "quickstart.md"
        - "walkthrough.md"
        - "coming-from-fds-evac.md"
    - source: ../docs
      target: content/docs/understanding
      includeFiles:
        - "concepts.md"
        - "limitations.md"
        - "model-comparison.md"
    - source: ../docs
      target: content/docs/using
      includeFiles:
        - "fds-case-requirements.md"
        - "usage.md"
        - "howto-rset-ensemble.md"
        - "assets.md"
        - "fds-sampling.md"
    # A group with a single page takes that page as its index.
    - source: ../docs/smoke-speed-model.md
      target: content/docs/implementation/speed/_index.md
    - source: ../docs
      target: content/docs/implementation/routing
      includeFiles:
        - "routing.md"
        - "route-cost-gate.md"
    - source: ../docs/wayfinding.md
      target: content/docs/implementation/wayfinding/_index.md
    - source: ../docs
      target: content/models/verification
      includeFiles:
        - "testing-homogeneous.md"
        - "testing-heat.md"
        - "testing-familiarity.md"
    - source: ../artifacts
      target: static/artifacts
    - source: ../assets/t_junction
      target: static/t_junction
    - source: static
      target: static

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Fundamentals
      pageRef: /fundamentals
      weight: 2
    - name: Models
      pageRef: /models
      weight: 3
    - name: Talks
      pageRef: /talks
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/PedestrianDynamics/pyFDS-Evac"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.png
      width: 28
      height: 28

  page:
    width: wide

  footer:
    displayCopyright: false
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  math: true
