baseURL: https://pedestriandynamics.org/pyFDS-Evac/
languageCode: en-us
title: pyFDS-Evac

markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      image:
        enableDefault: true
      link:
        enableDefault: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]

# last-updated dates from the last commit touching each page
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    # The reference documentation lives in the repository's docs/ directory
    # and is served from there unchanged; working notes stay out of the site.
    # docs/ stays flat for GitHub readers; the mounts below place each page
    # into its sidebar group. A page listed in a group mount must also be
    # listed in excludeFiles here, or it is served twice.
    - source: ../docs
      target: content/docs
      excludeFiles:
        - "*-notes.md"
        - "archive/**"
        - "superpowers/**"
        - "install.md"
        - "quickstart.md"
        - "walkthrough.md"
        - "first-fds-case.md"
        - "start-from-fds-deck.md"
        - "coming-from-fds-evac.md"
        - "concepts.md"
        - "limitations.md"
        - "model-comparison.md"
        - "fds-case-requirements.md"
        - "howto-create-scenario.md"
        - "usage.md"
        - "howto-with-without-fire.md"
        - "outputs.md"
        - "scenario-json.md"
        - "web-gui.md"
        - "terminal-ui.md"
        - "troubleshooting.md"
        - "howto-rset-ensemble.md"
        - "assets.md"
        - "fds-sampling.md"
        - "smoke-speed-model.md"
        - "routing.md"
        - "route-cost-gate.md"
        - "wayfinding.md"
        - "study-*.md"
        - "testing-*.md"
    - source: ../docs
      target: content/docs/getting-started
      includeFiles:
        - "install.md"
        - "quickstart.md"
        - "walkthrough.md"
        - "first-fds-case.md"
        - "start-from-fds-deck.md"
        - "coming-from-fds-evac.md"
    - source: ../docs
      target: content/docs/understanding
      includeFiles:
        - "concepts.md"
        - "limitations.md"
        - "model-comparison.md"
    - source: ../docs
      target: content/docs/using
      includeFiles:
        - "fds-case-requirements.md"
        - "howto-create-scenario.md"
        - "usage.md"
        - "outputs.md"
        - "scenario-json.md"
        - "web-gui.md"
        - "terminal-ui.md"
        - "troubleshooting.md"
        - "howto-rset-ensemble.md"
    - source: ../docs
      target: content/docs/studies
      includeFiles:
        # A study page is docs/study-<name>.md; this glob mounts it here.
        - "study-*.md"
        - "howto-with-without-fire.md"
    - source: ../docs/fds-sampling.md
      target: content/docs/implementation/fds-sampling.md
    # A group with a single page takes that page as its index.
    - source: ../docs/smoke-speed-model.md
      target: content/docs/implementation/speed/_index.md
    - source: ../docs
      target: content/docs/implementation/routing
      includeFiles:
        - "routing.md"
        - "route-cost-gate.md"
    - source: ../docs/wayfinding.md
      target: content/docs/implementation/wayfinding/_index.md
    - source: ../docs
      target: content/verification
      includeFiles:
        - "testing-homogeneous.md"
        - "testing-heat.md"
        - "testing-heat-radiometer.md"
        - "testing-familiarity.md"
        - "assets.md"
    - source: ../artifacts
      target: static/artifacts
    - source: ../assets/t_junction
      target: static/t_junction
    - source: static
      target: static
    # The TUI snapshot tests' SVGs, inlined by the terminal-figure shortcode,
    # so the Terminal UI page shows the screens the tests check. A mount for
    # assets replaces the default one, so assets/ is listed too.
    - source: ../tests/__snapshots__/test_tui
      target: assets/tui-snapshots
    # The package version shown on the landing page comes from here.
    - source: ../pyproject.toml
      target: assets/pyproject.toml
    - source: assets
      target: assets

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Fundamentals
      pageRef: /fundamentals
      weight: 2
    - name: Models
      pageRef: /models
      weight: 3
    - name: Verification
      pageRef: /verification
      weight: 4
    - name: Talks
      pageRef: /talks
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/PedestrianDynamics/pyFDS-Evac"
      params:
        icon: github

params:
  images:
    - images/brand/social-preview.png

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/brand/logo-mark.svg
      width: 28
      height: 28

  page:
    width: wide

  footer:
    displayCopyright: false
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # Hextra 0.8.4 loads KaTeX only for pages whose own params set math:
  # true, so each section sets it in its _index.md cascade. This
  # site-wide value has no effect on its own.
  math: true
