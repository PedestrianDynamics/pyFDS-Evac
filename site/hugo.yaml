baseURL: https://pedestriandynamics.org/pyFDS-Evac/
languageCode: en-us
title: pyFDS-Evac

markup:
  goldmark:
    renderer:
      unsafe: true
    renderHooks:
      image:
        enableDefault: true
      link:
        enableDefault: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]

# last-updated dates from the last commit touching each page
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    # The reference documentation lives in the repository's docs/ directory
    # and is served from there unchanged; working notes stay out of the site.
    - source: ../docs
      target: content/docs
      excludeFiles:
        - "*-notes.md"
        - "archive/**"
        - "superpowers/**"
    - source: ../artifacts
      target: static/artifacts
    - source: ../assets/t_junction
      target: static/t_junction
    - source: static
      target: static

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Models
      pageRef: /models
      weight: 2
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/PedestrianDynamics/pyFDS-Evac"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.png
      link: /
      width: 28
      height: 28

  page:
    width: wide

  footer:
    displayCopyright: false
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  math: true
