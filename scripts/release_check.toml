[[page.step]]
name = "GUI starts"
# The page's `uv sync --extra gui` is part of the check environment. The
# GUI must answer on its port, then it is stopped. A free port replaces
# the page's 5001 (fasthtml reads PORT), so a running GUI does not clash.
run = """\
export PORT=$(python3 -c 'import socket; s = socket.socket(); s.bind(("", 0)); print(s.getsockname()[1])')
uv run app.py > "$WORK/app.log" 2>&1 &
pid=$!
ok=
for _ in $(seq 90); do
  if curl -fsS -o /dev/null "http://localhost:$PORT/"; then ok=1; break; fi
  kill -0 "$pid" 2>/dev/null || break
  sleep 1
done
kill "$pid" 2>/dev/null; wait "$pid" 2>/dev/null
cat "$WORK/app.log"
[ -n "$ok" ] && echo "GUI answered on http://localhost:$PORT"
"""
timeout = 180
expect = ["GUI answered on http://localhost:"]

