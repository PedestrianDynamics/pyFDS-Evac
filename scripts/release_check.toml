# The documented commands that scripts/release_check.sh runs, page by page.
#
# Not every code block of a page is meant to be run: some are illustrative,
# some need FDS, mpiexec or JURECA, some take hours. This file lists, by
# hand, the commands that are run and what they must print. Keep it in step
# with the pages: a command changed on a page is changed here.
#
# Each step runs with bash in a clean checkout of the commit under test
# (REPO, the working directory unless `cwd` is set), with the uv
# environment of the release check. Variables available to every step:
#
#   REPO           the checkout
#   WORK           a fresh folder of this page, outside the checkout
#   FDS_EVAC_DATA  the sciebo data store (fds-evac-data/)
#
# Page keys:
#   name, source   the page and its Markdown file
#   copy           [dest, src]: copy FDS_EVAC_DATA/src to WORK/dest before
#                  the first step (a copy-on-write clone, so FDS readers
#                  never write into the data store)
#   copy_quick     the same, in --quick only (stored evacuation runs that
#   copy_full      --full re-runs); copy_full in --full only
#   env            variables set for every step; $WORK is expanded
# Step keys:
#   name, run      what the step does and its commands (the page's, with
#                  placeholders such as <out> replaced by a WORK path)
#   mode           "all" (default), "quick" or "full"
#   timeout        seconds (default 600)
#   exit_ok        accepted exit codes (default [0]). run.py exits with 2
#                  when a run reaches its time limit with agents inside;
#                  list 2 only where the page expects an incomplete run
#   expect         lines the output must contain (whitespace-insensitive);
#                  a missing line fails the step
#   expect_bundle  key of site/data/examples.toml whose `expected` lines
#                  are added to `expect`
#   expect_stale   lines that an open issue already says are out of date;
#   stale          a missing one gives STALE (with the issue number
#                  `stale`), not FAIL
#   stored_runs    commit of the stored runs a --quick analysis reads; a
#                  match then checks the analysis, not the current model
#   manual         reason the step is not run (FDS, GUI); reported MANUAL
#   blocks         false: a failure does not skip the page's later steps
#
# [bundle.<key>.<step number>] adds checks to a numbered step of a download
# bundle's README.txt (the bundles gate stops before the FDS step).

