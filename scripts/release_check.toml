[[page]]
name = "iso-test-18"
source = "site/content/verification/iso-test-18.md"

[[page.step]]
name = "tests"
run = "uv run pytest tests/test_smoke_speed.py -k iso_table21 tests/test_iso_table21_coupled.py"
